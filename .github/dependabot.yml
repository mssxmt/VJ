version: 2

updates:
  # npm dependencies — security PRs are issued regardless of schedule.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      react-ecosystem:
        patterns:
          - react
          - react-dom
          - '@react-three/*'
          - '@types/react*'
      three-ecosystem:
        patterns:
          - three
          - '@types/three'
          - postprocessing
      build-tooling:
        dependency-type: development
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # Keep GitHub Actions versions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
